# Docs preview, step 3 of 3: remove a pull request's preview when it closes.
# Never checks out the pull request.
# See pimlock/openshell-docs/.github/workflows/preview-remove.yml.
name: Docs preview close

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out the PR; only removes its preview
    types: [closed]

permissions: {}

jobs:
  remove:
    uses: pimlock/openshell-docs/.github/workflows/preview-remove.yml@801f0fce8b2ba3f01907d60dbacc0ae9e8bfeefd
    with:
      site-ref: 801f0fce8b2ba3f01907d60dbacc0ae9e8bfeefd
    permissions:
      contents: write
      pull-requests: write
