name: Docs preview
on:
  pull_request:
    paths: [docs/**]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          mkdir -p meta site
          echo '{"pr": 6, "head_sha": "x", "docset": "driver-docker"}' > meta/meta.json
          echo '<h1>Spoofed preview</h1>' > site/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: docs-preview-site, path: site}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: docs-preview-meta, path: meta/meta.json}
