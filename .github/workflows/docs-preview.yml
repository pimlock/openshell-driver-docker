# Docs preview, step 1 of 3: build this pull request's docs with the shared
# site theme. Runs with the pull request's code (forks included), so it gets
# a read-only token and no secrets. "Docs preview publish" publishes the
# result to https://pimlock.github.io/openshell-driver-docker/pr-<n>/.
# See pimlock/openshell-docs/.github/workflows/preview-build.yml.
name: Docs preview

on:
  pull_request:
    paths: [docs/**]

permissions: {}

jobs:
  build:
    uses: pimlock/openshell-docs/.github/workflows/preview-build.yml@cedfa3b9dd941e4bbc6a7bfb2e9eef380e509f7a
    with:
      docset: driver-docker
      site-ref: cedfa3b9dd941e4bbc6a7bfb2e9eef380e509f7a
    permissions:
      contents: read
