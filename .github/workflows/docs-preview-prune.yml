# Docs previews: daily cleanup. Removes previews of pull requests that are no
# longer open (in case the close workflow missed one) and previews published
# more than 30 days ago (the next push publishes them again). gh-pages stays
# a single commit.
# See pimlock/openshell-docs/.github/workflows/preview-prune.yml.
name: Docs preview prune

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    uses: pimlock/openshell-docs/.github/workflows/preview-prune.yml@cedfa3b9dd941e4bbc6a7bfb2e9eef380e509f7a
    with:
      site-ref: cedfa3b9dd941e4bbc6a7bfb2e9eef380e509f7a
      max-age-days: 30
    permissions:
      contents: write
      pull-requests: read
