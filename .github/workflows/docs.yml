# Check and build this repo's docs with the docs build package pinned in
# package-lock.json: links within the docs, links to other repos' docs, and
# links from other repos' docs into these (checked against the live site).
name: Docs

on:
  pull_request:
    paths: [docs/**, package.json, package-lock.json]
  push:
    branches: [main]
    paths: [docs/**, package.json, package-lock.json]

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check links
        run: npm run docs:check
      - name: Build the site
        run: npm run docs:build
