# Docs preview, step 2 of 3: publish a build from "Docs preview" to gh-pages
# and report it on the pull request. Runs from main with write access, and
# never runs the pull request's code. Previews of branches in this repo use
# the docs-preview environment; previews of forks use docs-preview-fork,
# which needs a maintainer's approval.
# See pimlock/openshell-docs/.github/workflows/preview-publish.yml.
name: Docs preview publish

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never runs PR code; artifacts are verified data
    workflows: [Docs preview]
    types: [completed]

permissions: {}

jobs:
  publish:
    uses: pimlock/openshell-docs/.github/workflows/preview-publish.yml@801f0fce8b2ba3f01907d60dbacc0ae9e8bfeefd
    with:
      site-ref: 801f0fce8b2ba3f01907d60dbacc0ae9e8bfeefd
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
